    <header>
        <span style="float: right;" class="header-title">Exo7</span>
        <h1>Fractions rationnelles, polynômes, équations algébriques</h1>
        <p>Exercices de Jean-Louis Rouget. Retrouver aussi cette fiche sur <a href="http://www.maths-france.fr">www.maths-france.fr</a></p>
        <p style="font-size: 0.9em; color: #777;">
            * très facile ** facile *** difficulté moyenne **** difficile ***** très difficile<br>
            I: Incontournable T: pour travailler et mémoriser le cours
        </p>
    </header>

    <h2>Énoncés</h2>

    <div class="exercise" id="exo-1">
        <p class="exo-title">Exercice 1</p>
        <p>Décomposer en éléments simples dans $\mathbb{C}(X)$ les fractions rationnelles suivantes</p>
        <ol>
            <li>$$\frac{X^2+3X+5}{X^2-3X+2}$$</li>
            <li>$$\frac{X^2+1}{(X-1)(X-2)(X-3)}$$</li>
            <li>$$\frac{1}{X(X-1)^2}$$</li>
            <li>$$\frac{X^2+1}{(X-1)^2(X+1)^2}$$</li>
            <li>$$\frac{X^2+1}{(X-2)^2(X+2)^3}$$</li>
            <li>$$\frac{1}{(X^3-1)^2}$$</li>
            <li>$$\frac{X+1}{X^6+1}$$</li>
            <li>$$\frac{X^5-3X^4+5X^3-7X^2+6X-2}{X(X-1)(X-2)^2}$$</li>
            <li>$$\frac{X^5-3X^4+5X^3-7X^2+6X-2}{X(X-1)(X-2)^2}$$ (erreur d'énoncé, reprend le 8)</li>
            <li>$$\frac{X^2+1}{X^5-X^4+X^3-X^2+X-1}$$</li>
            <li>$$\frac{X^2+1}{(X^2+X+1)^3}$$</li>
            <li>$$\frac{X^2+1}{X(X-1)(X-2)^2}$$</li>
            <li>$$\frac{X^2+1}{(X+1)^7-X^7-1}$$</li>
        </ol>
        <a href="#corr-1" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-2">
        <p class="exo-title">Exercice 2</p>
        <p>Décomposer en éléments simples dans $\mathbb{C}(X)$ les fractions rationnelles suivantes</p>
        <ol>
            <li>$$\frac{1}{X^n-1}$$</li>
            <li>$$\frac{1}{(X-1)^2(X-i)}$$</li>
            <li>$$\frac{n!}{X(X-1)(X-2)\dots(X-n)}$$</li>
            <li>$$\frac{1}{X^4-2X^2\cos(2\alpha)+1}$$</li>
            <li>$$\frac{X^2+1}{X^{2n}+1}$$</li>
        </ol>
        <a href="#corr-2" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-3">
        <p class="exo-title">Exercice 3</p>
        <p>Soit $U_n$ l'ensemble des racines $n$-ièmes de l'unité dans $\mathbb{C}$. Écrire sous forme d'une fraction rationnelle (ou encore réduire au même dénominateur) $$F = \sum_{\omega \in U_n} \frac{\omega X + 1}{\omega X^2 + X + 1}$$</p>
        <a href="#corr-3" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-4">
        <p class="exo-title">Exercice 4</p>
        <p>Soit $F = \frac{P}{Q}$ où $P$ et $Q$ sont des polynômes tous deux non nuls et premiers entre eux. Montrer que $F$ est paire si et seulement si $P$ et $Q$ sont pairs. Établir un résultat analogue pour $F$ impaire.</p>
        <a href="#corr-4" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-5">
        <p class="exo-title">Exercice 5</p>
        <p>Montrer que $(\frac{X+\alpha}{X-\alpha})_{\alpha \in \mathbb{C}}$ est libre dans $\mathbb{K}(X)$.</p>
        <a href="#corr-5" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-6">
        <p class="exo-title">Exercice 6</p>
        <p>Calculer la dérivée $n$-ième de $\frac{1}{X^2+1}$.</p>
        <a href="#corr-6" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-7">
        <p class="exo-title">Exercice 7</p>
        <p>On pose $P = a(X - x_1)\dots(X - x_n)$ où les $x_i$ sont des complexes non nécessairement deux à deux distincts et $a$ est un complexe non nul.</p>
        <p>Calculer $\frac{P'}{P}$. De manière générale, déterminer la décomposition en éléments simples de $\frac{P'}{P}$ quand $P$ est un polynôme scindé. Une application : déterminer tous les polynômes divisibles par leur dérivée.</p>
        <a href="#corr-7" class="correction-link">Correction</a>
    </div>

    <div class="page-break"></div>

    <div class="exercise" id="exo-8">
        <p class="exo-title">Exercice 8</p>
        <p>Décomposer en produit de facteurs irréductibles dans $\mathbb{R}[X]$ le polynôme $X^6 – 2X^3 \cos a + 1$ où $a$ est un réel donné dans $[0, \pi]$.</p>
        <a href="#corr-8" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-9">
        <p class="exo-title">Exercice 9</p>
        <p>Soit $F = \frac{P}{Q}$ où $n$ est un entier naturel non nul, les $a_i$ sont des entiers relatifs et $a_0$ et $a_n$ sont non nuls. Soient $p$ un entier relatif non nul et $q$ un entier naturel non nul tels que $p \wedge q = 1$.</p>
        <p>Montrer que, si $r = \frac{p}{q}$ est une racine (rationnelle) de $P$ alors $p$ divise $a_0$ et $q$ divise $a_n$.</p>
        <p>Application. Résoudre dans $\mathbb{C}$ l'équation $9z^4 – 3z^3 + 16z^2 – 6z – 4 = 0$.</p>
        <a href="#corr-9" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-10">
        <p class="exo-title">Exercice 10 Equations réciproques</p>
        <p>Résoudre dans $\mathbb{C}$ les équations suivantes :</p>
        <ol>
            <li>$z^4 + 2z^3 + 3z^2 + 2z + 1 = 0$ en posant $Z = z + \frac{1}{z}$ (ou autrement).</li>
            <li>$z^6 – 5z^5 + 5z^4 – 5z^2 + 5z – 1 = 0$.</li>
            <li>$z^7 – z^6 – 7z^5 + 7z^4 + 7z^3 – 7z^2 – z + 1 = 0$.</li>
        </ol>
        <a href="#corr-10" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-11">
        <p class="exo-title">Exercice 11</p>
        <p>Former une équation du sixième degré dont les racines sont les $\sin \frac{k\pi}{7}$ où $k \in \{-3, -2, -1, 1, 2, 3\}$ puis montrer que ces six nombres sont irrationnels.</p>
        <a href="#corr-11" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-12">
        <p class="exo-title">Exercice 12</p>
        <p>Soit $P$ un polynôme à coefficients complexes de degré $4$.</p>
        <p>Montrer que les images dans le plan complexe des racines de $P$ forment un parallélogramme si et seulement si $P'$ et $P^{(3)}$ ont une racine commune</p>
        <a href="#corr-12" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-13">
        <p class="exo-title">Exercice 13</p>
        <p>Résoudre dans $\mathbb{C}^3$ le système
            $$\begin{cases} y^2+yz+z^2 = 7 \\ z^2+zx+x^2 = 13 \\ x^2+xy+y^2 = 3 \end{cases}$$
        </p>
        <a href="#corr-13" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-14">
        <p class="exo-title">Exercice 14</p>
        <p>Soit $n$ un entier naturel supérieur ou égal à $2$. Pour $k \in \mathbb{Z}$, on pose $\omega_k = e^{2ik\pi/n}$.</p>
        <ol>
            <li>Calculer $\prod_{k=0}^{n-1} (1 + \omega_k)$.</li>
            <li>Montrer que, pour tout réel $a$, $\prod_{k=0}^{n-1} (X^2 - 2X \cos(a + 2k\pi/n) + 1) = 2(1 - \cos(na))$ (questions indépendantes.)</li>
        </ol>
        <a href="#corr-14" class="correction-link">Correction</a>
    </div>

    <div class="page-break"></div>

    <div class="exercise" id="exo-15">
        <p class="exo-title">Exercice 15</p>
        <p>Déterminer $\lambda$ et $\mu$ complexes tels que les zéros de $z^4 - 4z^3 – 36z^2 + \lambda z + \mu$ soient en progression arithmétique. Résoudre alors l'équation.</p>
        <a href="#corr-15" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-16">
        <p class="exo-title">Exercice 16</p>
        <p>Soient $x_1, x_2, x_3$ les zéros de $X^3 + 2X – 1$. Calculer $x_1^4 + x_2^4 + x_3^4$.</p>
        <a href="#corr-16" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-17">
        <p class="exo-title">Exercice 17</p>
        <p>Soient $x_1, \dots, x_8$ les zéros de $X^8 + X^7 – X + 3$. Calculer $\sum_{1 \leq i < j < k \leq 8} \frac{x_i x_j}{x_k}$ (168 termes).</p>
        <a href="#corr-17" class="correction-link">Correction</a>
    </div>

    <div class="exercise" id="exo-18">
        <p class="exo-title">Exercice 18</p>
        <p>Résoudre dans $\mathbb{C}$ l'équation $z^4 – 21z + 8 = 0$ sachant qu'il existe deux des solutions sont inverses l'une de l'autre.</p>
        <a href="#corr-18" class="correction-link">Correction</a>
    </div>

    <div class="page-break"></div>
    <h2>Corrections</h2>

    <div class="correction" id="corr-1">
        <p class="exo-title"><a href="#exo-1" class="exercise-link">Correction de l'exercice 1</a></p>
        <p>1. $$\frac{X^2+3X+5}{X^2-3X+2} = 1 - \frac{9}{X-1} + \frac{15}{X-2}$$</p>
        <p>2. $$\frac{X^2+1}{(X-1)(X-2)(X-3)} = \frac{1}{X-1} - \frac{5}{X-2} + \frac{5}{X-3}$$</p>
        <p>3. $$\frac{1}{X(X-1)^2} = \frac{1}{X} - \frac{1}{X-1} + \frac{1}{(X-1)^2}$$</p>
        <p>4. $$\frac{X^2+1}{(X-1)^2(X+1)^2} = \frac{1}{2}\left(\frac{1}{(X-1)^2} + \frac{1}{(X+1)^2}\right)$$</p>
        <p>5. $$\frac{X^2+1}{(X-2)^2(X+2)^3} = \frac{3}{512(X-2)} - \frac{3}{256(X-2)^2} + \frac{1}{64(X-2)^3} + \dots$$ (voir PDF)</p>
        <p>6. $$\frac{1}{(X^3-1)^2}$$ (Décomposition complexe, voir PDF)</p>
        <p>7. $$\frac{X+1}{X^6+1}$$ (Pôles $\omega_k = e^{i(\pi+2k\pi)/6}$, $P.E=0$)</p>
        <p>8. $$\frac{X^5-3X^4+5X^3-7X^2+6X-2}{X(X-1)(X-2)^2} = X+1 + \frac{1}{X} - \frac{1}{X-1} + \frac{1}{(X-2)^2}$$</p>
    </div>

    <div class="correction" id="corr-2">
        <p class="exo-title"><a href="#exo-2" class="exercise-link">Correction de l'exercice 2</a></p>
        <p>1. $$\frac{1}{X^n-1} = \sum_{k=0}^{n-1} \frac{1/n}{X-\omega_k}$$ où $\omega_k = e^{2ik\pi/n}$.</p>
        <p>2. $$\frac{1}{(X-1)^2(X-i)} = \frac{a}{X-1} + \frac{b}{(X-1)^2} + \frac{c}{X-i}$$. $a = 1/2, b = 1/2, c = -1/2$.</p>
        <p>3. $$\frac{n!}{X(X-1)\dots(X-n)} = \sum_{k=0}^n \frac{(-1)^{n-k} \binom{n}{k}}{X-k}$$</p>
        <p>4. $$\frac{1}{X^4-2X^2\cos(2\alpha)+1} = \frac{1}{4}\left(\frac{1}{X^2-2X\cos\alpha+1} - \frac{1}{X^2+2X\cos\alpha+1}\right)$$</p>
    </div>

    <div class="correction" id="corr-3">
        <p class="exo-title"><a href="#exo-3" class="exercise-link">Correction de l'exercice 3</a></p>
        $$F = \sum_{\omega \in U_n} \frac{\omega X + 1}{\omega X^2 + X + 1} = \frac{n X^{n-1}}{X^n-1}$$
    </div>

    <div class="correction" id="corr-4">
        <p class="exo-title"><a href="#exo-4" class="exercise-link">Correction de l'exercice 4</a></p>
        <p>$F$ est paire $\Leftrightarrow P$ et $Q$ sont pairs, ou $P$ et $Q$ sont impairs.</p>
        <p>$F$ est impaire $\Leftrightarrow P$ est pair et $Q$ est impair, ou $P$ est impair et $Q$ est pair.</p>
    </div>

    <div class="correction" id="corr-5">
        <p class="exo-title"><a href="#exo-5" class="exercise-link">Correction de l'exercice 5</a></p>
        <p>La famille $\left(\frac{X+\alpha}{X-\alpha}\right)_{\alpha \in \mathbb{C}}$ est libre dans $\mathbb{K}(X)$ par unicité de la décomposition en éléments simples (polynômes de degré 1 sur des pôles simples distincts).
        </p>
    </div>

    <div class="correction" id="corr-6">
        <p class="exo-title"><a href="#exo-6" class="exercise-link">Correction de l'exercice 6</a></p>
        $$D^n\left(\frac{1}{X^2+1}\right) = \frac{(-1)^n n!}{2i} \left(\frac{1}{(X-i)^{n+1}} - \frac{1}{(X+i)^{n+1}}\right)$$
    </div>

    <div class="correction" id="corr-7">
        <p class="exo-title"><a href="#exo-7" class="exercise-link">Correction de l'exercice 7</a></p>
        $$\frac{P'(X)}{P(X)} = \sum_{i=1}^n \frac{1}{X-x_i}$$
        Polynômes divisibles par leur dérivée: $\lambda(X-a)^n$.
    </div>

    <div class="correction" id="corr-8">
        <p class="exo-title"><a href="#exo-8" class="exercise-link">Correction de l'exercice 8</a></p>
        $$X^6 – 2X^3 \cos a + 1 = (X^2 - 2X \cos(a/3) + 1)(X^2 - 2X \cos(a/3 + 2\pi/3) + 1)(X^2 - 2X \cos(a/3 - 2\pi/3) + 1)$$
    </div>

    <div class="correction" id="corr-9">
        <p class="exo-title"><a href="#exo-9" class="exercise-link">Correction de l'exercice 9</a></p>
        <p>Théorème de la racine rationnelle : $r=p/q$ racine $\implies p|a_0$ et $q|a_n$.</p>
        <p>Application: $9z^4 – 3z^3 + 16z^2 – 6z – 4 = 0$. Racines: $2/3, -1/3, \pm i\sqrt{2}$.</p>
    </div>

    <div class="correction" id="corr-10">
        <p class="exo-title"><a href="#exo-10" class="exercise-link">Correction de l'exercice 10</a></p>
        <p>1. $z^4 + 2z^3 + 3z^2 + 2z + 1 = 0 \implies z=j, j^2$.</p>
        <p>2. $z^6 – 5z^5 + 5z^4 – 5z^2 + 5z – 1 = 0 \implies z=\pm 1, 2\pm \sqrt{3}$.</p>
    </div>

    <div class="correction" id="corr-11">
        <p class="exo-title"><a href="#exo-11" class="exercise-link">Correction de l'exercice 11</a></p>
        <p>Équation: $64X^6 - 112X^4 + 54X^2 - 7 = 0$. Racines irrationnelles.</p>
    </div>

    <div class="correction" id="corr-12">
        <p class="exo-title"><a href="#exo-12" class="exercise-link">Correction de l'exercice 12</a></p>
        <p>Racines de $P$ forment un parallélogramme $\Leftrightarrow P'$ et $P^{(3)}$ ont une racine commune.
        </p>
    </div>

    <div class="correction" id="corr-13">
        <p class="exo-title"><a href="#exo-13" class="exercise-link">Correction de l'exercice 13</a></p>
        Solutions $(x, y, z)$ : permutations de $(1, 2\sqrt{3}, 3)$ etc. (voir PDF).
    </div>

    <div class="correction" id="corr-14">
        <p class="exo-title"><a href="#exo-14" class="exercise-link">Correction de l'exercice 14</a></p>
        <p>1. $\prod_{k=0}^{n-1} (1 + \omega_k) = \begin{cases} 0 & \text{si } n \text{ pair} \\ 2 & \text{si } n \text{ impair} \end{cases}$</p>
        <p>2. $\prod_{k=0}^{n-1} (X^2 - 2X \cos(a + 2k\pi/n) + 1) = 2(1-\cos(na))$.</p>
    </div>

    <div class="correction" id="corr-15">
        <p class="exo-title"><a href="#exo-15" class="exercise-link">Correction de l'exercice 15</a></p>
        Solutions $z \in \{1 \pm \frac{\sqrt{21}}{2}, 1 \pm \frac{\sqrt{21}}{2}\}$.
    </div>

    <div class="correction" id="corr-16">
        <p class="exo-title"><a href="#exo-16" class="exercise-link">Correction de l'exercice 16</a></p>
        $x_1^4 + x_2^4 + x_3^4 = 8$.
    </div>

    <div class="correction" id="corr-17">
        <p class="exo-title"><a href="#exo-17" class="exercise-link">Correction de l'exercice 17</a></p>
        $\sum_{1 \leq i < j < k \leq 8} \frac{x_i x_j}{x_k} = 168$. (Calculs complexes, voir PDF).
    </div>

    <div class="correction" id="corr-18">
        <p class="exo-title"><a href="#exo-18" class="exercise-link">Correction de l'exercice 18</a></p>
        $z^4 – 21z + 8 = 0$. Racines inverses: $z^4-21z+8 = (z^2+3z+1)(z^2-3z+8)$.
    </div>
